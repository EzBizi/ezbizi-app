//
// ns2 — the secondary nameserver (plan §15, TODO #25).
//
// ── What this fixes ──────────────────────────────────────────────
//
// ns1.ezbizi.com and ns2.ezbizi.com currently resolve to the SAME machine, so
// the domain has two nameservers on paper and one in practice. If that box
// stops answering, ezbizi.com stops existing — not "the site is down", but
// every MX, every subdomain and every certificate renewal, for as long as it
// takes to notice.
//
// Self-hosted DNS is a settled decision; this is about redundancy, not about
// moving to a managed service.
//
// ── Install this on the WEBSITES box (32.194.222.151) ────────────
//
// It already runs BIND. Nothing here touches the zones it already serves.
//
//   1. Put the transfer key on it — the SAME key, byte for byte, from
//      /etc/bind/ezbizi-xfer.key on the app box:
//
//        sudo tee /etc/bind/ezbizi-xfer.key <<'KEY'
//        key "ezbizi-xfer" {
//        	algorithm hmac-sha256;
//        	secret "<from the app box>";
//        };
//        KEY
//        sudo chown root:bind /etc/bind/ezbizi-xfer.key
//        sudo chmod 640 /etc/bind/ezbizi-xfer.key
//
//   2. Append the block below to /etc/bind/named.conf.local
//   3. sudo mkdir -p /var/lib/bind/secondary && sudo chown bind:bind /var/lib/bind/secondary
//   4. sudo named-checkconf && sudo systemctl reload named
//   5. Confirm it actually pulled the zone — an empty secondary is worse than
//      no secondary, because it answers authoritatively with nothing:
//
//        dig @32.194.222.151 app.ezbizi.com +short     # must return 100.24.188.241
//        dig @32.194.222.151 ezbizi.com SOA +short     # serial must match ns1
//
//   6. ONLY THEN point ns2 at it. Two edits, and both are needed:
//        - the A record for `ns2` in /var/lib/bind/ezbizi.com.hosts on the app
//          box: 100.24.188.241 -> 32.194.222.151 (rndc freeze / edit / bump the
//          serial / rndc thaw)
//        - the GLUE record at Namecheap. ns1 and ns2 are inside the zone they
//          serve, so resolvers cannot look them up without glue — changing only
//          the zone file leaves the internet still sending queries to the old
//          address, and nothing appears to be wrong until the first box fails.
//
// Doing step 6 before step 5 passes is the failure mode worth naming: half the
// world's queries would go to a machine that is not answering for this zone.
//

include "/etc/bind/ezbizi-xfer.key";

zone "ezbizi.com" {
	type slave;
	file "/var/lib/bind/secondary/ezbizi.com.hosts";

	// TSIG on the transfer, so the secondary proves who it is rather than
	// relying on its source address.
	masters { 100.24.188.241 key ezbizi-xfer; };

	// A secondary that accepts updates is a second source of truth. Changes
	// belong on ns1 and arrive here by transfer.
	allow-update { none; };

	// Nothing transfers FROM the secondary. It is a copy, and letting a
	// stranger AXFR it is the same zone-enumeration leak either way.
	allow-transfer { key "ezbizi-xfer"; };
};
