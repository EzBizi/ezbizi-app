# Live file: /etc/nginx/conf.d/wildcard_subdomains.conf
# This is what actually serves www.ezbizi.com (sites-available/ezbizi.conf is
# not enabled). Root is /var/www/www — confirmed on the box 2026-08-20.
#
# Install:
#   sudo cp deploy/nginx-security-headers.conf \
#           /etc/nginx/snippets/ezbizi-security-headers.conf
#   sudo cp deploy/nginx-wildcard-subdomains.conf \
#           /etc/nginx/conf.d/wildcard_subdomains.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The srv.ezbizi.com Webmin proxy is left as it is (not this change).

server_tokens off;

# ==========================================
# 1. ROOT HTTP -> ROOT HTTPS -> WWW HTTPS
# ==========================================
server {
    listen 80;
    server_name ezbizi.com *.ezbizi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include snippets/ezbizi-security-headers.conf;
    return 301 https://www.ezbizi.com$request_uri;
}

# ==========================================
# 2. SPECIFIC CORES: Main Website (WWW)
# ==========================================
server {
    listen 443 ssl;
    server_name www.ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/www;
    index index.html index.htm;

    include snippets/ezbizi-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /robots.txt {
        include snippets/ezbizi-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ \.(bak|sql|env|log|ini|sh) { deny all; access_log off; log_not_found off; }
}

# ==========================================
# 3. DYNAMIC FALLBACK: All other subdomains
# ==========================================
server {
    listen 443 ssl;
    server_name ~^(?<subdomain>(?!www$).+)\.ezbizi\.com$;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/$subdomain;
    index index.html index.htm index.php;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ==========================================
# Webmin Control Panel Proxy (unchanged)
# ==========================================
server {
    listen 443 ssl;
    server_name srv.ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
