# Live file: /etc/nginx/conf.d/wildcard_subdomains.conf
# This is what actually serves www.ezbizi.com (sites-available/ezbizi.conf is
# not enabled). Root is /var/www/www — confirmed on the box 2026-08-20.
#
# Install:
#   sudo cp deploy/nginx-security-headers.conf \
#           /etc/nginx/snippets/ezbizi-security-headers.conf
#   sudo cp deploy/nginx-wildcard-subdomains.conf \
#           /etc/nginx/conf.d/wildcard_subdomains.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# The srv.ezbizi.com Webmin proxy is left as it is (not this change).

server_tokens off;

# ==========================================
# 1. HTTP — marketing hostnames in ONE hop
# ==========================================
#
# Canonical origin is https://www.ezbizi.com. Sending http://ezbizi.com to
# https://ezbizi.com first (then www) is a redirect chain, which Search
# Console reports as "Page with redirect" on the apex and delays indexing
# of the real page.
#
# index.html / privacy.html / terms.html are rewritten here so Google is
# not sent to a second hop on HTTPS.

server {
    listen 80;
    server_name ezbizi.com www.ezbizi.com;

    location = /index.html { return 301 https://www.ezbizi.com/; }
    location = /index.htm  { return 301 https://www.ezbizi.com/; }
    location = /privacy.html { return 301 https://www.ezbizi.com/privacy/; }
    location = /terms.html   { return 301 https://www.ezbizi.com/terms/; }
    location / { return 301 https://www.ezbizi.com$request_uri; }
}

# Other names (app, dev, …) keep their own host.
server {
    listen 80;
    server_name *.ezbizi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include snippets/ezbizi-security-headers.conf;

    location = /index.html { return 301 https://www.ezbizi.com/; }
    location = /index.htm  { return 301 https://www.ezbizi.com/; }
    location = /privacy.html { return 301 https://www.ezbizi.com/privacy/; }
    location = /terms.html   { return 301 https://www.ezbizi.com/terms/; }
    location / { return 301 https://www.ezbizi.com$request_uri; }
}

# ==========================================
# 2. SPECIFIC CORES: Main Website (WWW)
# ==========================================
server {
    listen 443 ssl;
    server_name www.ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/www;
    index index.html index.htm;

    include snippets/ezbizi-security-headers.conf;

    # One URL for the homepage. `location = /index.html` would also catch the
    # INTERNAL rewrite nginx does for GET / (index index.html), which 301s
    # / to /index.html to / forever. $request_uri is the original request, so
    # GET / still serves the file and only a typed /index.html is redirected.
    if ($request_uri = /index.html) { return 301 https://www.ezbizi.com/; }
    if ($request_uri = /index.htm)  { return 301 https://www.ezbizi.com/; }

    # Filenames from the first upload. Directories with a trailing slash
    # are the URLs in the sitemap and the canonical tags.
    location = /privacy.html { return 301 https://www.ezbizi.com/privacy/; }
    location = /terms.html   { return 301 https://www.ezbizi.com/terms/; }

    # HTML: short cache so a CTA change is seen without telling Google
    # never to keep a copy (no-store is hostile to crawling).
    location / {
        try_files $uri $uri/ =404;
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /robots.txt {
        include snippets/ezbizi-security-headers.conf;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /sitemap.xml {
        include snippets/ezbizi-security-headers.conf;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(png|jpe?g|gif|svg|ico|webp)$ {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ \.(bak|sql|env|log|ini|sh) { deny all; access_log off; log_not_found off; }
}

# ==========================================
# 3. DYNAMIC FALLBACK: All other subdomains
# ==========================================
server {
    listen 443 ssl;
    server_name ~^(?<subdomain>(?!www$).+)\.ezbizi\.com$;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/$subdomain;
    index index.html index.htm index.php;

    location / {
        try_files $uri $uri/ =404;
    }
}

# ==========================================
# Webmin Control Panel Proxy (unchanged)
# ==========================================
server {
    listen 443 ssl;
    server_name srv.ezbizi.com;

    ssl_certificate /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass https://127.0.0.1:10000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
