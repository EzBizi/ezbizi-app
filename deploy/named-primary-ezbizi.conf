//
// ns1 — the primary for ezbizi.com (plan §15).
//
// Lives on the app box at /etc/bind/named.conf.local. Versioned here because it
// was configured by hand once and would otherwise exist only on one machine —
// which is the same problem the secondary is being added to solve.
//
// The transfer key itself is NOT in this repo. It is at
// /etc/bind/ezbizi-xfer.key on the box, and in _secrets/ off it.
//
// To change:
//   scp deploy/named-primary-ezbizi.conf app:/tmp/
//   ssh app 'sudo cp /tmp/named-primary-ezbizi.conf /etc/bind/named.conf.local \
//            && sudo named-checkconf && sudo systemctl reload named'
//

include "/etc/bind/ezbizi-xfer.key";

zone "ezbizi.com" {
	type master;
	file "/var/lib/bind/ezbizi.com.hosts";

	// certbot writes _acme-challenge here during renewal.
	allow-update { key "certbot-key"; };

	// Zone transfers are authenticated by TSIG, not by source address. An IP
	// allow-list is spoofable and breaks the moment the secondary moves; a
	// shared key survives both. Everything not holding the key is refused,
	// which is also what stops a stranger enumerating every host in the zone
	// with one AXFR.
	allow-transfer { key "ezbizi-xfer"; };

	// Tell the secondary the moment the zone changes rather than making it
	// wait out the refresh interval. Without this a certbot update or an
	// A-record change takes up to an hour to reach ns2, and during that window
	// the two nameservers answer differently — which is worse than one
	// nameserver, because the wrong answer is cached.
	notify yes;
	also-notify { 32.194.222.151; };
};
