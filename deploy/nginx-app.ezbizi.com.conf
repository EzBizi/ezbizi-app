# app.ezbizi.com — the EzBizi application (plan §12).
#
# VERSIONED ON PURPOSE. nginx config is infrastructure, but it is also the thing
# that decides whether .env is readable — the A1 Tools audit found it served
# with HTTP 200 because a prefix location shadowed the deny rules (§17). Keeping
# it in the repo means changes are reviewable and a rebuilt box is reproducible.
#
# Install:  sudo cp deploy/nginx-app.ezbizi.com.conf /etc/nginx/sites-available/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.ezbizi.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 on this box: http2 goes on the listen line. The separate
    # `http2 on;` directive is 1.25.1+ and is a hard config error here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ezbizi.com;

    ssl_certificate     /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    root /var/www/ezbizi-current/public;

    # index.html FIRST: /app/ is a Flutter SPA whose entry point is index.html.
    # With index.php alone, /app/ 403s while /app/main.dart.js happily 200s —
    # which looks like a permissions problem and is not.
    index index.html index.php;

    # Resolve the release symlink per request, so a deploy swaps code without
    # nginx serving a cached path to the previous release.
    disable_symlinks off;

    charset utf-8;
    client_max_body_size 32M;

    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "SAMEORIGIN"     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none"   always;

    # ── the Flutter SPA ──
    # Falls back to index.html so client-side routes survive a page refresh.
    # Without this, deep links 404 the moment a user reloads.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # The service worker must never be cached, or clients keep running an old
    # build after a deploy and there is no way to push them forward.
    location = /app/flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # ── Laravel ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nothing outside public/ is reachable, but belt and braces. Unanchored
    # \.bak because real backups are named people.php.bak-1785444684 and a
    # `\.bak$` regex misses every one of them (§17).
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ \.(bak|sql|env|log|ini|sh) { deny all; access_log off; log_not_found off; }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hashed Flutter assets are immutable; index.html above is excluded.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|webp|wasm|json)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/app.ezbizi.com.access.log;
    error_log  /var/log/nginx/app.ezbizi.com.error.log;
}
