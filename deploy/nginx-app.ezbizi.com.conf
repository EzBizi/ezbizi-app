# app.ezbizi.com — the EzBizi application (plan §12).
#
# VERSIONED ON PURPOSE. nginx config is infrastructure, but it is also the thing
# that decides whether .env is readable — the A1 Tools audit found it served
# with HTTP 200 because a prefix location shadowed the deny rules (§17). Keeping
# it in the repo means changes are reviewable and a rebuilt box is reproducible.
#
# Install:
#   sudo cp deploy/nginx-security-headers.conf \
#           /etc/nginx/snippets/ezbizi-security-headers.conf
#   sudo cp deploy/nginx-app.ezbizi.com.conf /etc/nginx/sites-available/app.ezbizi.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name app.ezbizi.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 on this box: http2 goes on the listen line. The separate
    # `http2 on;` directive is 1.25.1+ and is a hard config error here.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.ezbizi.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    # The app IS the site. Flutter serves the root; Laravel handles /api only.
    #
    # An earlier version put the SPA under /app/ to dodge a collision with
    # Laravel's index.php. That was solving the wrong problem — the collision
    # disappears once the two are given separate roots, and users should not
    # have to type a path segment that exists for the server's convenience.
    root /var/www/ezbizi/public-app;
    index index.html;

    # Resolve the release symlink per request, so a deploy swaps code without
    # nginx serving a cached path to the previous release.
    disable_symlinks off;

    charset utf-8;
    client_max_body_size 32M;

    # Included here AND in every location that sets add_header. nginx drops
    # server-level add_header the moment a location defines its own, which is
    # how the SPA was shipping with no X-Frame-Options at all.
    include snippets/ezbizi-security-headers.conf;

    # ── the Flutter SPA, at the root ──
    # Falls back to index.html so client-side routes survive a refresh. Without
    # it, deep links 404 the moment a user reloads the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry points, or clients keep running an old build after a
    # deploy and there is no way to push them forward.
    #
    # This list is longer than it looks like it needs to be, and every entry
    # earned its place. Flutter web does NOT hash `main.dart.js` or
    # `flutter_bootstrap.js` — they keep the same filename and change content —
    # so the "hashed assets are immutable" rule below was matching them and
    # telling browsers to hold a 30-day immutable copy of the file that names
    # the current build. index.html was correctly no-cache the whole time and it
    # made no difference: the bootstrap it loaded was a month old.
    #
    # An exact-match location wins over a regex one in nginx regardless of
    # order, which is what makes these four override the rule further down.
    location = /index.html {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter_bootstrap.js {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /main.dart.js {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # The --wasm build's entry points: unhashed like main.dart.js, so never
    # cached (the regex below would make them immutable for 30 days). nginx's
    # mime.types has no .mjs, and nosniff refuses an untyped module script.
    location ~ ^/main\.dart\.(wasm|mjs)$ {
        types { application/wasm wasm; text/javascript mjs; }
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /version.json {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter_service_worker.js {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # FontManifest.json is not hashed. Flutter writes the same path every
    # build and the icon font it names changes. The immutable regex below
    # matches `.json`, so a browser that loaded the app once kept a 30-day
    # copy pointing at MaterialIcons-Regular.otf. That file is gone (the
    # build renames it per commit); `location /` then served this page as
    # the "font" and every Material icon became an empty box. Incognito
    # looked fine because it had no cache. Same story for AssetManifest
    # and flutter.js (SDK file, same name across upgrades).
    location = /assets/FontManifest.json {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /assets/AssetManifest.bin.json {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter.js {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Missing images/fonts must 404, not fall through to the SPA. A stale
    # FontManifest that still names MaterialIcons-Regular.otf would otherwise
    # download index.html as a font.
    location ^~ /assets/ {
        include snippets/ezbizi-security-headers.conf;
        try_files $uri =404;
    }

    # Public staff AUTH is refused here. The Development tab still talks to
    # /api/v1/staff with a token issued after the authenticator on that tab,
    # or from dev.ezbizi.com. What a phish dressed as this host must not have
    # is a login of its own. Laravel repeats this check
    # (RefuseStaffAuthOnCustomerHost).
    location = /api/v1/staff/auth/login { return 404; }
    location = /api/v1/staff/auth/enrolment { return 404; }
    location = /api/v1/staff/auth/enrolment/confirm { return 404; }

    # ── Laravel: the API and health check only ──
    #
    # `^~`, not a bare prefix. Without it the static-asset regex at the foot of
    # this file — ~* \.(css|js|jpg|...)$ — WINS over this location for any API
    # path ending in one of those extensions, because a regex location outranks
    # a plain prefix one in nginx whatever their lengths. /api/v1/web/ezbizi.js
    # was therefore answered from the FLUTTER root, where no such file exists,
    # and returned an nginx 404 to every customer who followed the documented
    # snippet URL. The route was registered, the file shipped, and the URL was
    # unreachable. The same request spelled .jsx reached Laravel and produced a
    # JSON 404, which is what identified the extension rather than the path.
    #
    # The three exact-match staff denials above still win: `=` outranks `^~`.
    # And nothing is exposed by skipping the dotfile and bad-extension denials
    # for this prefix — try_files is rooted at public/, which holds index.php,
    # robots.txt, an empty favicon and the app symlink, with no public/api to
    # walk into; anything else falls through to Laravel and its own 404.
    location ^~ /api {
        root /var/www/ezbizi-current/public;
        try_files $uri /index.php?$query_string;
    }

    # The websites box (32.194.222.151) is the peer watchdog. A public /up
    # page is a cheap fingerprint and nothing a customer needs.
    location /up {
        allow 127.0.0.1;
        allow ::1;
        allow 32.194.222.151;
        deny all;
        root /var/www/ezbizi-current/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/ezbizi-current/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Nothing outside public/ is reachable, but belt and braces. Unanchored
    # \.bak because real backups are named people.php.bak-1785444684 and a
    # `\.bak$` regex misses every one of them (§17).
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ \.(bak|sql|env|log|ini|sh) { deny all; access_log off; log_not_found off; }

    location = /favicon.ico { access_log off; log_not_found off; }

    location = /robots.txt {
        include snippets/ezbizi-security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Genuinely hashed (or versioned) static files — canvaskit, images.
    # Do not put `json` on this list: FontManifest.json and friends keep
    # the same name and change contents. Exact-match no-cache rules above
    # would win today, but a deleted exact-match would silently brick
    # icons for a month again. `/assets/` is excluded by the `^~` prefix.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|otf|webp|wasm)$ {
        expires 30d;
        include snippets/ezbizi-security-headers.conf;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/app.ezbizi.com.access.log;
    error_log  /var/log/nginx/app.ezbizi.com.error.log;
}
