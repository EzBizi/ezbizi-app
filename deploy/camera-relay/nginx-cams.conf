# cams.ezbizi.com — viewers' MJPEG, each request checked by Laravel first.
server {
    listen 443 ssl;
    server_name cams.ezbizi.com;
    ssl_certificate     /etc/letsencrypt/live/cams.ezbizi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cams.ezbizi.com/privkey.pem;

    location = /api/stream.mjpeg {
        auth_request /_play_check;
        proxy_pass http://127.0.0.1:1984;
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Access-Control-Allow-Origin *;
    }

    location = /_play_check {
        internal;
        proxy_pass http://127.0.0.1/api/v1/camera-relay/play-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host app.ezbizi.com;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Relay-Secret CAMERA_RELAY_SECRET_HERE;
    }

    location / { return 404; }
}
