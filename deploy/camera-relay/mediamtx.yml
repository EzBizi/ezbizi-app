# Camera relay on the box (camera bridge, phase 1). MediaMTX v1.21.2.
# Bridges publish RTMPS on :1936; only the box's own go2rtc reads, on loopback.
# Every publish and read is decided by Laravel (POST /api/v1/camera-relay/auth).
logLevel: info

authMethod: http
# Overridden by MTX_AUTHHTTPADDRESS in /etc/ezbizi/camera-relay.env (it carries
# ?secret=<CAMERA_RELAY_SECRET>; MediaMTX does not expand variables here).
authHTTPAddress: https://app.ezbizi.com/api/v1/camera-relay/auth
authHTTPExclude: []

api: no
metrics: no
hls: no
webrtc: no
srt: no
# MediaMTX 1.21 turns MoQ on by default and listens publicly on 8892/8893.
moq: no

rtsp: yes
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

rtmp: yes
rtmpAddress: 127.0.0.1:1935
rtmpEncryption: "optional"
rtmpsAddress: :1936
rtmpServerKey: /etc/letsencrypt/live/cams.ezbizi.com/privkey.pem
rtmpServerCert: /etc/letsencrypt/live/cams.ezbizi.com/fullchain.pem

paths:
  "~^cam-[0-9a-f-]{36}-(sub|main)$":
    # The box's go2rtc is the one reader; it leaves when the last viewer does.
    runOnRead: /opt/camera-relay/viewers.sh 1
    runOnUnread: /opt/camera-relay/viewers.sh 0
