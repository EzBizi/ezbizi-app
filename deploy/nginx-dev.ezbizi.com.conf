# dev.ezbizi.com — the EzBizi control plane, the "Development tab" (plan §4.2).
#
# VERSIONED ON PURPOSE, like the customer vhost. This file decides what is
# reachable from the internet, which is not something to keep only on a box.
#
# ── What this replaced, and why it mattered ──────────────────────
#
# This hostname previously served /var/www/ezbizi/public — the TEST SANDBOX. That
# directory is where the deploy gate extracts `git archive main` before running
# the suite, and it holds a copy of the production .env, so the box was publicly
# serving an unreviewed second copy of the application against the real database,
# with dev dependencies installed. Nothing points at it now.
#
# ── One bundle, two faces ────────────────────────────────────────
#
# The same Flutter build serves this host and app.ezbizi.com; the client reads
# its own hostname and shows the control-plane sign-in here (see
# client/lib/core/deployment.dart). That is presentation, NOT a boundary — the
# boundary is mandatory TOTP, the class check in StaffOnly, and app.ezbizi.com
# refusing /api/v1/staff outright.
#
# Install:
#   sudo cp deploy/nginx-security-headers.conf \
#           /etc/nginx/snippets/ezbizi-security-headers.conf
#   sudo cp deploy/nginx-dev.ezbizi.com.conf \
#           /etc/nginx/sites-available/dev.ezbizi.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dev.ezbizi.com;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    # No `http2` here, deliberately. On nginx 1.24 protocol options belong to the
    # listen SOCKET, not the server block, and app.ezbizi.com already sets them
    # for 0.0.0.0:443 — repeating it earns "protocol options redefined" on every
    # reload. HTTP/2 is on for this host regardless. A config that warns every
    # time is a config nobody reads the warnings of.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.ezbizi.com;
    server_tokens off;

    # The wildcard covers this host already — no separate certificate, and so
    # no second renewal that can quietly lapse.
    ssl_certificate     /etc/letsencrypt/live/ezbizi.com-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ezbizi.com-0002/privkey.pem;

    root /var/www/ezbizi/public-app;
    index index.html;

    # Resolve the release symlink per request, so a deploy swaps code without
    # nginx serving a cached path to the previous release.
    disable_symlinks off;

    charset utf-8;
    client_max_body_size 32M;

    # Included here AND in every location that sets add_header. nginx drops
    # server-level add_header the moment a location defines its own, which is
    # how the SPA was shipping with no X-Frame-Options at all.
    include snippets/ezbizi-security-headers.conf;

    # Nothing here belongs in a search index. Staff sign-in pages turn up in
    # results otherwise, and the first thing that finds one is a scanner.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── the Flutter SPA, at the root ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry points, or clients keep running an old build after a
    # deploy and there is no way to push them forward.
    #
    # This list is longer than it looks like it needs to be, and every entry
    # earned its place. Flutter web does NOT hash `main.dart.js` or
    # `flutter_bootstrap.js` — they keep the same filename and change content —
    # so the "hashed assets are immutable" rule below was matching them and
    # telling browsers to hold a 30-day immutable copy of the file that names
    # the current build. index.html was correctly no-cache the whole time and it
    # made no difference: the bootstrap it loaded was a month old.
    #
    # An exact-match location wins over a regex one in nginx regardless of
    # order, which is what makes these four override the rule further down.
    location = /index.html {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter_bootstrap.js {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /main.dart.js {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # The --wasm build's entry points (see nginx-app.ezbizi.com.conf).
    location ~ ^/main\.dart\.(wasm|mjs)$ {
        types { application/wasm wasm; text/javascript mjs; }
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /version.json {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter_service_worker.js {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # See nginx-app.ezbizi.com.conf: FontManifest.json was a 30-day brick.
    location = /assets/FontManifest.json {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /assets/AssetManifest.bin.json {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /flutter.js {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /manifest.json {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location ^~ /assets/ {
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ── Laravel ──
    #
    # The WHOLE API, not just /api/v1/staff. Impersonation (§4.2) is meant to let
    # staff reach a client's records from here, and those are ordinary tenant
    # endpoints — narrowing this to the staff prefix would have to be undone the
    # day that lands.
    location /api {
        root /var/www/ezbizi-current/public;
        try_files $uri /index.php?$query_string;
    }

    location /up {
        allow 127.0.0.1;
        allow ::1;
        allow 32.194.222.151;
        deny all;
        root /var/www/ezbizi-current/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/ezbizi-current/public;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Unanchored \.bak because real backups are named people.php.bak-1785444684
    # and a `\.bak$` regex misses every one of them (§17).
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~ \.(bak|sql|env|log|ini|sh) { deny all; access_log off; log_not_found off; }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Do not put `json` on this list — see nginx-app.ezbizi.com.conf.
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|otf|webp|wasm)$ {
        expires 30d;
        include snippets/ezbizi-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log /var/log/nginx/dev.ezbizi.com.access.log;
    error_log  /var/log/nginx/dev.ezbizi.com.error.log;
}
