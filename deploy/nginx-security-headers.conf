# Shared security headers for every EzBizi vhost.
#
# nginx `add_header` in a `server` block is DROPPED by any `location` that sets
# its own `add_header`. The SPA entry points set Cache-Control, so they were
# shipping with no X-Frame-Options / nosniff at all. Include this file in the
# server block AND in every location that has an add_header of its own.
#
# Install:
#   sudo cp deploy/nginx-security-headers.conf \
#           /etc/nginx/snippets/ezbizi-security-headers.conf
#
# www.ezbizi.com is a static vhost on the same box, not versioned here. Paste
# the same include into that server block (and any location that sets
# add_header) so the marketing site sends HSTS and cannot be framed. HSTS
# includeSubDomains only covers children of the host that sent the header, so
# the apex/www response is the one that protects every name.

add_header X-Content-Type-Options            "nosniff"        always;
add_header X-Frame-Options                   "SAMEORIGIN"     always;
add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none"           always;
add_header Strict-Transport-Security         "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy           "frame-ancestors 'self'" always;
