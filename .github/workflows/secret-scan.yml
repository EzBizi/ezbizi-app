# Secret and personal-data scan on every push and pull request.
#
# Runs the gitleaks binary (not gitleaks-action, which needs a paid licence key
# for repositories owned by an organization) with the repo's .gitleaks.toml:
# the default secret rules plus US phone numbers and personal-domain email
# addresses in docs/, tests/ and client/test/.
#
# It scans the COMMITS a push or PR adds, not all history: history still holds
# personal data until docs/security/history-rewrite-plan.md is carried out, and
# a full-history scan would fail every build until then.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Work out the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${AFTER}"
          else
            # A new branch: everything on it that main does not have.
            git fetch --no-tags origin main:refs/remotes/origin/main || true
            range="origin/main..${AFTER}"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Scanning $range"

      - name: gitleaks
        run: |
          gitleaks git --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --log-opts="--no-merges ${{ steps.range.outputs.range }}" \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
