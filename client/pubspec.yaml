name: ezbizi_client
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.2.3
  flutter_html: ^3.0.0
  http: ^1.6.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  web: ^1.1.1
  video_player: ^2.11.1
  flutter_local_notifications: ^22.3.0

  # ── Taking calls inside the app, which needs a different engine per platform
  #
  # There is no single Twilio Voice SDK that covers everything EzBizi ships on.
  # The JS SDK is a browser script; the Android and iOS SDKs are native; there
  # is none at all for Windows or Linux. So:
  #
  #   web              the JS SDK, already wired by hand in voice_device_web
  #   android/ios      twilio_voice, wrapping the native SDKs (CallKit and
  #                    ConnectionService, so an incoming call rings the phone
  #                    the way a phone call should)
  #   macos            twilio_voice too, which runs the web SDK there
  #   windows          the JS SDK hosted in WebView2 — the only way in, and a
  #                    port of the one A-1 Tools already runs
  #   linux            nothing exists; calls ring the person's own handset
  twilio_voice: ^0.5.0
  webview_windows: ^0.4.0
  flutter_secure_storage: ^11.0.0

  # Native file dialogs. The web build uses the browser's own <input type=file>
  # (see files_web.dart) and needs nothing; every other target had no dialog at
  # all, so files_io.dart stubbed all of them to null and "Add photo" silently
  # did nothing on Windows. Flutter ships no file dialog, so this is a package
  # or three FFI bindings — file_selector is flutter/packages' own, federated
  # across windows/macos/linux/android/ios, and needs no runtime permission.
  file_selector: ^1.0.3
  audioplayers: ^6.7.1
  window_manager: ^0.5.2
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  battery_plus: ^7.1.1
  # Field safety recordings (from A1 Tools, 2026-10-16): AAC on the phone,
  # one-minute files kept in app support until the server has each one.
  record: ^6.2.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  webview_flutter: ^4.14.1

  # A PDF drawn as its pages, for the onboarding contract's PDF view (Jose,
  # 2026-10-01: "PDF (Final Result view)"). Android's WebView cannot show a
  # PDF at all; printing rasterizes with the platform's own renderer on
  # Android, iOS and macOS, and with pdfium on Windows, which its CMake
  # downloads at build time. The web build shows the PDF in the browser's own
  # viewer and never calls it, so pdf.js is never fetched from a CDN.
  printing: ^5.14.2
  desktop_drop: 0.7.1

  # The how-to video in the app on Windows too (Jose, 2026-10-14: "video
  # should be seen on desktop, mobile, etc, right not it only works on
  # web"). video_player has no Windows half; this is one, through Media
  # Foundation, picked up by video_player itself. Checked on Windows before
  # it was chosen: it loaded, played and seeked a network mp4.
  video_player_win: ^3.3.1
  # Download on a phone: file_selector cannot save on Android or iOS, so the
  # video goes to the gallery (Photos). Desktop and web keep Files.download.
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # integration_test is DELIBERATELY NOT DECLARED, and must not be added back
  # without reading this.
  #
  # It drives the real app on a simulator to take App Store and Play
  # screenshots. Declared here as a dev_dependency it BREAKS EVERY ANDROID
  # RELEASE BUILD on Flutter 3.41.6:
  #
  #   GeneratedPluginRegistrant.java:39: error: package
  #   dev.flutter.plugins.integration_test does not exist
  #
  # The tool writes one GeneratedPluginRegistrant.java for every build mode and
  # lists integration_test in it, while the release compile path excludes dev
  # dependencies — so the registrant names a class release cannot see. The
  # manifest is not confused about it; .flutter-plugins-dependencies correctly
  # says dev_dependency = true. The registrant simply does not honour the flag.
  #
  # Debug is unaffected, which is what made it invisible: `flutter run`,
  # `flutter test` and `flutter drive` all pass. Only the artefact that ships
  # fails, and only on Android.
  #
  # TO TAKE SCREENSHOTS: run scripts/store-screenshots.sh. It adds the two
  # lines below to its own synced copy on the relay and removes them again,
  # so they never reach this file and no release can inherit them. Do not add
  # them here by hand - that is the mistake this arrangement exists to stop.
  #
  #   integration_test:
  #     sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.9.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/social/

    # The app icon Windows shows on a toast. Declared as an asset rather than
    # left to windows/runner/resources/app_icon.ico because that .ico is
    # compiled INTO ezbizi.exe as a resource, and the toast icon is a path in
    # the registry — Windows opens the file itself, at display time, so it has
    # to exist on disk for as long as EzBizi is installed. A Flutter asset does
    # (data/flutter_assets, beside the exe); a compiled-in resource does not.
    # See ClientPlatform.installedAssetPath.
    - assets/logo/app-icon-120.png

    # The Twilio Voice JS SDK and the page that hosts it, for Windows. Vendored
    # rather than fetched: WebView2 serves this folder from a virtual host so
    # the page is a secure context, which getUserMedia requires, and a CDN
    # fetch would put a network dependency in the path of answering a call.
    - assets/softphone/

    # Listed SEPARATELY because Flutter's asset globbing does NOT recurse:
    # `assets/softphone/` ships the four files directly inside it and none of
    # the sounds. Verified by building Windows and looking in the bundle, where
    # the folder came out empty.
    #
    # That omission is invisible in every other way. The phone registers,
    # routes calls correctly, and rings SILENTLY, because the CSP on the host
    # page refuses the Twilio CDN the SDK would otherwise fall back to — which
    # is the right posture and is also what makes a missing local file fatal
    # rather than merely slow.
    - assets/softphone/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
