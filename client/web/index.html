<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EzBizi — one platform for your whole operation.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EzBizi">
  <!-- UI queue 67: Safari on an iPhone offers the app (Apple draws it). -->
  <meta name="apple-itunes-app" content="app-id=6805979795">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EzBizi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Twilio Voice SDK, served by us rather than from unpkg.

    This was a CDN <script> until 2026-08-27. Two problems with that, and the
    softphone is not a decorative feature: a network that blocks unpkg — or an
    unpkg outage — takes Phone down with no fallback and no signal, and a CDN
    fetch is whatever that host chooses to answer with at request time. Pinning
    the file into the build makes the bytes we ship the bytes we reviewed.

    Upgrading is a deliberate act: fetch the new dist, replace this file, bump
    the name so a stale cache cannot serve the old one, and re-check that it
    still exports the `Twilio` global our JS interop binds to
    (client/lib/screens/phone/voice_device_web.dart).
  -->
  <script src="vendor/twilio-voice-2.15.0.min.js"></script>
  <!--
    hls.js, served by us rather than from a CDN — same reasoning as the Twilio
    file above, and the same reasoning the softphone learned the hard way: a
    runtime CDN <script> is a network dependency and an at-request-time set of
    bytes we did not review. Camera Monitoring's inline HLS playback binds to
    the `Hls` global this file defines (client/lib/screens/monitoring/
    camera_view_web.dart); when the file is absent or the browser has no native
    HLS, that tile falls back to the copy-URL deep-link card instead.

    Source: https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.14/hls.min.js
    (UMD build; sets globalThis.Hls). The trailing `//# sourceMappingURL=` line
    was stripped — we do not vendor the .map, and leaving it only 404s in
    devtools. Upgrading is the same deliberate act as Twilio's: fetch the new
    dist, strip that line, replace this file, bump the name so a stale cache
    cannot serve the old one, and re-check it still exports the `Hls` global.
  -->
  <script src="vendor/hls-1.6.14.min.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // CanvasKit's wasm can abort ("RuntimeError: Aborted()": 164 times from
    // 11 people, 10-16 to 11-02). After that the render tree is dead and the
    // screen freezes, so reload once with a note. At most once a minute, so a
    // build that aborts on start cannot loop.
    (function () {
      function aborted(v) {
        return /Aborted\(/.test(String((v && (v.message || v.reason)) || v || ''));
      }
      function recover(e) {
        if (!aborted(e && (e.error || e.reason || e.message))) return;
        var key = 'ezbizi.wasm-reload', now = Date.now(), last = 0;
        try { last = +sessionStorage.getItem(key) || 0; } catch (_) {}
        if (now - last < 60000) return;
        try { sessionStorage.setItem(key, String(now)); } catch (_) { return; }
        var n = document.createElement('div');
        n.textContent = 'Reloading…';
        n.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
          'background:#1f2a30;color:#fff;padding:10px 18px;border-radius:10px;' +
          'font:14px sans-serif;z-index:2147483647';
        document.body.appendChild(n);
        setTimeout(function () { location.reload(); }, 800);
      }
      window.addEventListener('error', recover);
      window.addEventListener('unhandledrejection', recover);
    })();
  </script>
  <script>
    // Unregister any service worker this browser already installed, and empty
    // its caches.
    //
    // The app is built with --pwa-strategy=none, so nothing registers one any
    // more — but a worker installed by an EARLIER build keeps running and keeps
    // serving main.dart.js out of Cache Storage, which ignores HTTP cache
    // headers completely. Every visitor who loaded the site before this change
    // is pinned to whatever build they first saw, and no amount of deploying or
    // fixing nginx reaches them. This is the only thing that does.
    //
    // EzBizi is a business application that must always be current; it is not
    // an offline-first PWA. There is nothing to gain from a worker here and a
    // whole class of "I don't see my changes" to lose.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => Promise.all(rs.map((r) => r.unregister())))
        .then((unregistered) => {
          if (!unregistered.some(Boolean)) return;

          // A worker was controlling this page, so what is on screen came from
          // its cache. Clear the caches and reload once to land on the real
          // build. The flag stops that reload looping.
          return caches.keys()
            .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
            .then(() => {
              if (sessionStorage.getItem('ezbizi.sw-cleared')) return;
              sessionStorage.setItem('ezbizi.sw-cleared', '1');
              location.reload();
            });
        })
        .catch(() => {});
    }
  </script>
  <script>
    // Belt and braces to flutter_service_worker.js's self-destruct.
    //
    // That one catches a browser whose old worker is still doing update checks.
    // This catches the page directly: anybody who reaches a fresh index.html
    // unregisters whatever is registered and empties Cache Storage, without
    // waiting for the worker's own update cycle to come round.
    //
    // The app registers no service worker at all now (--pwa-strategy=none), so
    // there is never anything here worth keeping. It is offline support this
    // app does not have and a stale-build risk it does not need.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (registrations) {
          registrations.forEach(function (registration) {
            registration.unregister();
          });
        })
        .catch(function () {
          // Private modes and some embedded webviews refuse the API. A stale
          // cache is survivable; a page that will not start is not.
        });

      if (window.caches && caches.keys) {
        caches.keys()
          .then(function (keys) {
            keys.forEach(function (key) { caches.delete(key); });
          })
          .catch(function () {});
      }
    }
  </script>

  <script>
    // FontManifest.json was served as Cache-Control: public, immutable for
    // 30 days. Flutter does not hash it. A browser that loaded the app before
    // the icon font was renamed still has a manifest pointing at
    // MaterialIcons-Regular.otf — which is gone, so nginx used to return this
    // page as the "font", and every Material icon became an empty box.
    // Incognito looked fine because it had no cache.
    //
    // index.html itself is no-cache, so this runs for everybody. cache:reload
    // replaces the poisoned copy in the HTTP cache before the engine reads
    // it. Then we load the bootstrap. A 2s timeout still starts the app if
    // the refetch hangs, rather than leaving a blank page.
    (function () {
      var started = false;
      function start() {
        if (started) return;
        started = true;
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      var timeout = setTimeout(start, 2000);
      var manifests = [
        'assets/FontManifest.json',
        'assets/AssetManifest.bin.json'
      ];
      Promise.all(manifests.map(function (url) {
        return fetch(url, { cache: 'reload' }).catch(function () {});
      })).then(function () {
        clearTimeout(timeout);
        start();
      }).catch(function () {
        clearTimeout(timeout);
        start();
      });
    })();
  </script>
</body>
</html>
