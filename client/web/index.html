<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EzBizi — one platform for your whole operation.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EzBizi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EzBizi</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Unregister any service worker this browser already installed, and empty
    // its caches.
    //
    // The app is built with --pwa-strategy=none, so nothing registers one any
    // more — but a worker installed by an EARLIER build keeps running and keeps
    // serving main.dart.js out of Cache Storage, which ignores HTTP cache
    // headers completely. Every visitor who loaded the site before this change
    // is pinned to whatever build they first saw, and no amount of deploying or
    // fixing nginx reaches them. This is the only thing that does.
    //
    // EzBizi is a business application that must always be current; it is not
    // an offline-first PWA. There is nothing to gain from a worker here and a
    // whole class of "I don't see my changes" to lose.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((rs) => Promise.all(rs.map((r) => r.unregister())))
        .then((unregistered) => {
          if (!unregistered.some(Boolean)) return;

          // A worker was controlling this page, so what is on screen came from
          // its cache. Clear the caches and reload once to land on the real
          // build. The flag stops that reload looping.
          return caches.keys()
            .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
            .then(() => {
              if (sessionStorage.getItem('ezbizi.sw-cleared')) return;
              sessionStorage.setItem('ezbizi.sw-cleared', '1');
              location.reload();
            });
        })
        .catch(() => {});
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
